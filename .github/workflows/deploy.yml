name: CI/CD Production Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Перевірка коду
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Зібрати Tailwind CSS
        run: npm run build:css

      # Порівнюємо набір класів, а не байти: мініфікатор може по-різному об'єднувати однакові правила
      # залежно від кінців рядків (CRLF у Windows, LF у CI). Деплой однаково використовує свіжозібраний CSS.
      - name: Усі класи з css/tailwind.css є у свіжій збірці
        run: |
          git show HEAD:css/tailwind.css > /tmp/committed.css
          node -e '
            const fs = require("fs");
            const sel = (f) => new Set((fs.readFileSync(f, "utf8").match(/\.[a-zA-Z][\w\\:\/\[\]().%#-]*/g) || []));
            const fresh = sel("css/tailwind.css"), old = sel("/tmp/committed.css");
            const missing = [...fresh].filter((s) => !old.has(s));
            if (missing.length) {
              console.log("::warning::Закомічений css/tailwind.css застарів (" + missing.length + " нових класів). Виконайте npm run build:css. Деплой використає свіжу збірку.");
            } else {
              console.log("css/tailwind.css актуальний");
            }'

      - name: Синтаксис JavaScript
        run: for f in js/*.js; do node --check "$f"; done

      - name: Валідність vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"

  deploy:
    name: Деплой на Vercel (production)
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Перевірити секрети
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задано (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зібрати Tailwind CSS для деплою
        run: npm ci && npm run build:css

      - name: Встановити Vercel CLI
        run: npm install --global vercel@latest

      - name: Отримати налаштування проєкту Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Деплой
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
